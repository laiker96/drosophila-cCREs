schema_version: 1
name: dm6 atlas contact-source manifest
row_model: One row is one downloaded contact matrix; multiple rows in one context are merged at the raw-count level before ICE balancing.
format: tsv
allow_extra_columns: false

required_columns:
  - source_id
  - context
  - assay
  - replicate
  - format
  - url
  - local_path
  - checksum
  - match_quality
  - biological_context
  - caveat

fields:
  source_id:
    type: string
    pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
  context:
    type: string
    pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
  assay:
    type: enum
    values: [Micro-C, Hi-C]
  replicate:
    type: string
  format:
    type: enum
    values: [mcool, cool.gz, h5]
  url:
    type: string
    pattern: '^https://'
  local_path:
    type: string
    description: Must be data/raw/contacts/<source_id> with the suffix implied by format.
  checksum:
    type: string
    pattern: '^(md5:[0-9a-f]{32}|sha256:[0-9a-f]{64})$'
    allow_blank: true
    description: Upstream-reported checksum when one is published; downloaded files are always SHA-256 recorded in normalization provenance.
  match_quality:
    type: string
  biological_context:
    type: string
  caveat:
    type: string
    allow_blank: true

cross_field_rules:
  - source_id and local_path are unique.
  - Only contexts configured with strategy=observed may occur in this manifest.
  - All source resolutions must exactly divide the configured output resolution; approximate rebinning is rejected.
  - Replicate counts are summed before one ICE balancing pass per context.
